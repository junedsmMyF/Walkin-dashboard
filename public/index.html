<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founders Office Dashboard</title>
<style>
:root{
  --yellow:#FFD100; --yellow-soft:#FFF6CC;
  --ground:#F4F6F9; --card:#FFFFFF; --line:#DDE5ED; --line-soft:#E8EDF3;
  --ink:#101820; --muted:#4E5A64; --side:#101820; --side-ink:#EEF2F6; --side-muted:#A3AFBA;
  --accent:#1F5FB8; --accent-mid:#6CACE4; --accent-soft:#E3EEFB;
  --warn:#C8373C; --warn-mid:#FF585D; --warn-soft:#FFE3E4;
  --good:#1B7A4E; --good-soft:#DDF7E9;
  --amber-soft:#FFF4C2; --amber-ink:#5C4A00; --neutral-bar:#C9D3DD;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Gilroy','Outfit',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--ground);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--accent)} a:hover{color:#123E7A}
button,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 8px}
.brand-name{font-size:18px;font-weight:600;color:#fff;text-decoration:none;display:block}
.brand-sub{font-size:12px;color:var(--side-muted);margin-top:2px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:12px;color:var(--side-muted);padding:0 8px 6px}
.nav-link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px;min-height:40px}
.nav-link:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-link.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.nav-sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 12px;padding-left:10px;border-left:1px solid rgba(255,255,255,.15)}
.nav-sub .nav-link{font-size:13px;min-height:36px;padding:8px 10px}
.soon{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--side-muted)}
.live{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:#1B7A4E;color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 8px}

.main{padding:28px 40px 60px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{text-decoration:none}
.crumbs .sep{color:#9AA7B3}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em}
.lede{margin:6px 0 0;color:var(--muted);max-width:70ch}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.b-amber{background:var(--amber-soft);color:var(--amber-ink)}
.b-grey{background:#E8EDF3;color:#333F48}
.b-blue{background:var(--accent-soft);color:#123E7A}
.b-warn{background:var(--warn-soft);color:#8E1F24}

/* Landing cards */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;min-height:190px;transition:border-color .15s}
.tile:hover{border-color:var(--accent);color:var(--ink)}
.tile h2{margin:0;font-size:19px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile .tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.tile.muted{background:#F6F8FB}
.tile .open{font-weight:600;color:var(--accent)}

/* Walk-in module */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:11px 16px;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.filters{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.f-label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.f-label select{font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:38px}
.seg{display:flex;gap:2px;padding:2px;background:#fff;border:1px solid var(--line);border-radius:8px}
.seg button{font-size:13px;padding:8px 14px;border:0;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:3fr 2fr}
.g21{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card h2{margin:0;font-size:16px;font-weight:600}
.card .sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.kpis{display:grid;gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .k-label{font-size:12px;font-weight:500;color:var(--muted)}
.kpi .k-value{font-size:28px;font-weight:600}
.kpi .k-delta{font-size:12px;font-weight:600}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.up{color:var(--accent)} .down{color:var(--warn)} .flat{color:var(--muted)}

.tree{display:flex;align-items:stretch;gap:8px;margin-top:16px;overflow-x:auto}
.node{flex:1 1 0;min-width:140px;text-decoration:none;color:var(--ink);padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:#F6F8FB;display:flex;flex-direction:column;gap:3px}
.node:hover{border-color:var(--accent);color:var(--ink)}
.node.hot{background:var(--warn-soft);border-color:#FFB3B5}
.node .n-label{font-size:12px;color:var(--muted);font-weight:500}
.node .n-value{font-size:21px;font-weight:600}
.node .n-rate{font-size:12px;color:var(--muted)}
.arrow{align-self:center;color:#9AA7B3;font-size:18px}

.rowgrid{display:grid;gap:9px 14px;align-items:center;margin-top:16px}
.colhead{font-size:12px;font-weight:500;color:var(--muted)}
.right{text-align:right}
.store-name{font-size:13px;font-weight:600;display:block}
.store-meta{font-size:11px;color:var(--muted)}
.track{height:12px;background:#E8EDF3;border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}

.heat{display:grid;gap:4px;margin-top:14px}
.hcell{height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.hname{font-size:12px;font-weight:600;align-self:center}
.hhead{font-size:11px;font-weight:500;color:var(--muted);text-align:center}

.tbl-wrap{overflow-x:auto;margin-top:12px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:13px;padding:9px 10px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
td.strong{font-weight:600}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}

.trendbox{position:relative;height:220px;margin-top:14px}
.trendbars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:5px}
.trendbars div{flex:1;border-radius:3px 3px 0 0}
.trendbox svg{position:absolute;inset:0;width:100%;height:100%}

.stage{border:1px solid var(--line);background:#F6F8FB;border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-width:130px}
.stage.hot{background:var(--warn-soft);border-color:#FFB3B5}
.stage .s-n{font-size:21px;font-weight:600}
.stage .s-l{font-size:12px;font-weight:500;color:var(--muted)}
.stage .s-v{font-size:12px;color:var(--muted)}
.lane{display:flex;align-items:center;gap:8px;overflow-x:auto}
.lane-name{width:120px;flex:none;font-size:12px;font-weight:500;color:var(--muted)}

.soonwrap{max-width:560px;margin:60px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:48px 36px}
.soonwrap h1{font-size:28px}
.soonwrap p{color:var(--muted);margin:12px 0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
.btn:hover{background:#174C95;color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

.menu-btn{display:none}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nbtn{display:inline-flex;align-items:center;min-height:38px;padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer}
.nbtn:hover{border-color:var(--accent);color:var(--accent)}
.nbtn:disabled{opacity:.45;cursor:default;border-color:var(--line);color:var(--ink)}
.nbtn.home{background:var(--accent);border-color:var(--accent);color:#fff}
.nbtn.home:hover{background:#174C95;color:#fff}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{display:flex;flex-direction:column;gap:2px;min-width:200px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--accent)}
.pager .p-dir{font-size:12px;color:var(--muted)}
.pager .p-name{font-size:15px;font-weight:600;color:var(--accent)}
.pager .next{text-align:right;margin-left:auto}
.flow{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.flow-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbox{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#F6F8FB;min-width:150px}
.fbox b{display:block;font-size:14px}
.fbox span{font-size:12px;color:var(--muted)}
.fbox.rev{background:var(--accent-soft);border-color:#B7CFDA}
.fbox.lead{background:#EAF2FC}
.fbox.leak{background:var(--warn-soft);border-color:#FFB3B5}
.flow-tag{width:130px;flex:none;font-size:12px;font-weight:500;color:var(--muted)}
.formula{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;background:#F1F4F8;border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;margin-top:8px;white-space:normal}
.status{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}

[hidden]{display:none!important}
/* ---------- Walk-in module: design-board system ---------- */
.wl{background:#F4F2EC;color:#1B1F24;font-family:'IBM Plex Sans',system-ui,sans-serif;border-radius:18px;padding:36px 44px;display:flex;flex-direction:column;gap:22px;margin-bottom:18px}
.wl a{color:#1F5E7A}.wl a:hover{color:#123C4F}
.wl table{border-collapse:collapse;width:100%}
.wl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wl-eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:#1F5E7A}
.wl h1{margin:6px 0 0;font-family:Fraunces,Georgia,serif;font-size:36px;font-weight:600;color:#1B1F24;line-height:1.15}
.wl-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wl-asof{font-size:13px;color:#5B6068;text-align:right}
.wl-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.wl-pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.p-amber{background:#FBEFD5;color:#6E4A05}.p-grey{background:#ECEAE4;color:#45484D}.p-teal{background:#DCE9EF;color:#123C4F}.p-peach{background:#F6E1D1;color:#7A3610}
.wl-tabs{display:flex;gap:4px;border-bottom:1px solid #E3DFD4;overflow-x:auto}
.wl-tab{padding:12px 18px;font-size:14px;color:#5B6068 !important;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.wl-tab.on{font-weight:600;color:#1B1F24 !important;border-bottom-color:#1F5E7A}
.wl-tab.aux{color:#8A8F96 !important}
.wl-filters{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.wl-fl{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:#5B6068;letter-spacing:.02em}
.wl-seg{display:flex;gap:2px;padding:2px;background:#fff;border:1px solid #E3DFD4;border-radius:8px}
.wl-seg button{font-family:inherit;font-size:13px;padding:8px 14px;border:0;border-radius:6px;background:transparent;color:#1B1F24;min-height:34px;cursor:pointer}
.wl-seg button.on{background:#1B1F24;color:#fff}
.wl select,.wl input[type=date]{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #E3DFD4;border-radius:8px;background:#fff;color:#1B1F24;min-height:38px}
.wl-btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border:1px solid #E3DFD4;border-radius:8px;background:#fff;color:#1B1F24;min-height:38px;cursor:pointer}
.wl-kpis{display:grid;gap:14px}
.wl-kpi{background:#fff;border:1px solid #E3DFD4;border-radius:14px;box-sizing:border-box;padding:18px;display:flex;flex-direction:column;gap:6px}
.k-l{font-size:12px;font-weight:600;color:#5B6068}
.k-v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:#1B1F24;line-height:1.15}
.k-v.none{color:#A7A39A}
.k-d{font-size:12px;font-weight:600;color:#1F5E7A}.k-d.bad{color:#A8501A}.k-d.flat{color:#5B6068}
.k-s{font-size:12px;color:#5B6068}
.wl-card{background:#fff;border:1px solid #E3DFD4;border-radius:14px;padding:22px;box-sizing:border-box;min-width:0}
.wl-card h2{margin:0;font-size:16px;font-weight:600;color:#1B1F24}
.wl-card .sub{margin:4px 0 0;font-size:13px;color:#5B6068}
.wl-ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.wl-note{font-size:12px;color:#5B6068}
.wl-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wl-g21{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.wl-g53{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.wl-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.wl th{text-align:left;font-size:12px;font-weight:600;color:#5B6068;padding:8px 10px;border-bottom:1px solid #E3DFD4;white-space:nowrap}
.wl td{font-size:13px;padding:9px 10px;border-bottom:1px solid #EFECE4;font-variant-numeric:tabular-nums}
.wl td.b{font-weight:600}.wl td.good{color:#1F5E7A;font-weight:600}.wl td.bad{color:#A8501A;font-weight:600}
.wl-tw{overflow-x:auto;margin-top:12px}
.wl-colhead{font-size:11px;font-weight:600;color:#5B6068;letter-spacing:.02em}
.wl-tree{display:flex;align-items:center;gap:10px;margin-top:18px}
.wl-node{flex:1 1 0;min-width:0;text-decoration:none;color:#1B1F24 !important;padding:14px 16px;border-radius:10px;border:1px solid #E3DFD4;background:#F8F7F3;display:flex;flex-direction:column;gap:4px;min-height:96px;box-sizing:border-box}
.wl-node.hot{background:#F6E1D1;border-color:#E9B999}
.wl-node.await{background:#FAF9F5;border-style:dashed;border-color:#D5D0C4}
.n-l{font-size:12px;font-weight:600;color:#5B6068}.n-v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.n-v.none{color:#A7A39A}.n-s{font-size:12px;color:#5B6068}
.wl-arrow{font-size:18px;color:#A7A39A}
.wl-rank{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 70px 80px;gap:8px 14px;align-items:center;margin-top:16px}
.wl-sn{font-size:13px;font-weight:600;display:block}.wl-sm{font-size:11px;color:#5B6068;display:block}
.wl-track{flex-grow:1;height:12px;background:#EFECE4;border-radius:4px;overflow:hidden;display:flex}
.wl-fill{height:12px;border-radius:4px}
.wl-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#5B6068}
.wl-legend span{display:flex;align-items:center;gap:6px}
.wl-sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.wl-heat{display:grid;gap:6px;margin-top:14px;align-items:center}
.wl-hh{font-size:11px;font-weight:600;color:#5B6068;text-align:center}
.wl-hn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-cell{border-radius:6px;padding:9px 0;text-align:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.wl-sent{background:#DCE9EF;color:#123C4F}.wl-miss{background:#F6E1D1;color:#7A3610}.wl-na{background:#F1EFEA;color:#A7A39A}
.wl-daypill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.wl-list .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #EFECE4;font-size:13px}
.wl-list .row b{color:#A8501A;font-variant-numeric:tabular-nums}
.wl-await{margin-top:16px;border:1px dashed #D5D0C4;border-radius:10px;background:#FAF9F5;padding:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;color:#5B6068;font-size:13px}
.wl-await b{color:#1B1F24;font-size:13px}
.wl-tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#ECEAE4;color:#45484D}
.wl-trend{position:relative;height:220px;margin-top:14px}
.wl-bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:6px}
.wl-bars > div{flex-grow:1;border-radius:3px 3px 0 0}
.wl-axis{display:flex;justify-content:space-between;font-size:11px;color:#5B6068;margin-top:6px}
.wl-fbox{border:1px solid #E3DFD4;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wl-coh{display:inline-block;min-width:44px;padding:4px 6px;border-radius:4px;color:#fff;font-weight:600;font-size:12px;text-align:center}
.wl-track-lbl{font-size:11px;font-weight:600;color:#5B6068;letter-spacing:.02em;width:84px;flex:none}
.wl-fresh{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:#5B6068}
.wl-fresh b{color:#1B1F24;font-weight:600}
@media (max-width:1180px){.wl{padding:24px 20px}.wl-g21,.wl-g53{grid-template-columns:1fr}.wl-kpis{grid-template-columns:repeat(3,minmax(0,1fr)) !important}}
@media (max-width:860px){.wl-g2{grid-template-columns:1fr}.wl-tree{flex-wrap:wrap}.wl-tree .wl-arrow{display:none}.wl-node{flex:1 1 45%}.wl-kpis{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.wl h1{font-size:28px}.wl-meta{align-items:flex-start}.wl-pills{justify-content:flex-start}}

/* Live data */
.src{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--muted);background:#F1F4F8;border-radius:999px;padding:2px 8px;align-self:flex-start}
.fresh{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.fresh b{color:var(--ink);font-weight:600}
.range-note{font-size:12px;color:var(--muted);align-self:center}
span.strong{font-weight:600}
/* Design flow */
.dz-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.dz-tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;text-decoration:none;color:var(--ink);background:#fff}
.dz-tab:hover{border-color:var(--ink);color:var(--ink)}
.dz-tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.dz-host{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-height:120px}
.dz-host #dzMsg{padding:20px}
/* Brand layer (Frido brand book) */
h1 em{font-style:italic;font-weight:300}
.nav-link.active{background:var(--yellow);color:var(--ink)}
.nav-link.active .soon{background:rgba(16,24,32,.12);color:var(--ink)}
.brand-name{display:flex;align-items:center;gap:8px}
.brand-dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--yellow);display:inline-block;box-sizing:border-box}
.tab.active{border-bottom:3px solid var(--yellow)}
.nbtn,.seg,.seg button,.btn,.badge,.pill{border-radius:999px}
.nbtn.home,.btn{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.nbtn.home:hover,.btn:hover{background:#F2C500;color:var(--ink)}
.btn.ghost{background:#fff;border:1px solid var(--ink);color:var(--ink)}
.btn.ghost:hover{background:var(--yellow-soft);color:var(--ink)}
.card,.kpi,.tile{border-radius:16px}
.hero{border-radius:20px;padding:28px 30px;margin-bottom:18px;background:linear-gradient(120deg,#FFD100 0%,#FFE66B 38%,#FFF5C4 72%,#FFFFFF 100%);display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hero h1{font-size:36px;font-weight:600;letter-spacing:-.02em}
.hero .lede{color:#2B333B}
.eyebrow{font-size:13px;font-weight:500;color:#2B333B;margin:0 0 6px}
.hero-pill{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff}
.hl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.hl{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.hl:hover{border-color:var(--ink);color:var(--ink)}
.hl .h-label{font-size:12px;font-weight:500;color:var(--muted)}
.hl .h-value{font-size:30px;font-weight:600;letter-spacing:-.01em}
.hl .h-src{font-size:12px;color:var(--muted);margin-top:4px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft);text-decoration:none;color:var(--ink)}
.item:last-child{border-bottom:0}
.item:hover .i-title{text-decoration:underline}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.item .i-title{display:block;font-weight:600;font-size:14px}
.item .i-sub{display:block;font-size:13px;color:var(--muted)}
.item .i-go{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.hier{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.vert{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vert-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:#F6F8FB;text-decoration:none;color:var(--ink)}
.vert-head:hover{background:var(--yellow-soft);color:var(--ink)}
.vert-head b{font-size:16px}
.proj{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 18px 12px 34px;border-top:1px solid var(--line-soft);text-decoration:none;color:var(--ink)}
a.proj:hover{background:#FAFBFD;color:var(--ink)}
.p-meta{font-size:13px;color:var(--muted)}
.proj-stats{display:flex;gap:18px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.proj-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.b-good{background:var(--good-soft);color:var(--good)}
@media (max-width: 1100px){ .hl-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .proj{flex-wrap:wrap} }
@media (max-width: 1100px){
  .g32,.g21,.g2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;display:none}
  .side.open{display:flex}
  .menu-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:600;margin-bottom:14px;cursor:pointer}
  .main{padding:20px 16px 48px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <main class="main" id="main">
    <div class="toolbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="side">Menu</button>
      <div class="navbtns" role="group" aria-label="Page navigation">
        <button class="nbtn" id="backBtn" type="button">← Back</button>
        <button class="nbtn" id="fwdBtn" type="button">Forward →</button>
        <a class="nbtn" id="upBtn" href="#/">Up one level</a>
        <a class="nbtn home" id="homeBtn" href="#/">Home</a>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

const card = (title, sub, body, right='') => `<section class="card"><div class="card-head"><div><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${right}</div>${body}</section>`;

/* ---------- Routing and history ---------- */
const nav = { stack: [], pos: -1 };
function track(h){
  if (nav.stack[nav.pos] === h) return;
  if (nav.pos > 0 && nav.stack[nav.pos - 1] === h) { nav.pos--; return; }
  if (nav.stack[nav.pos + 1] === h) { nav.pos++; return; }
  nav.stack = nav.stack.slice(0, nav.pos + 1); nav.stack.push(h); nav.pos = nav.stack.length - 1;
}
function parentOf(p){
  if (p.length === 0) return null;
  if (p[0] === 'retail' && p.length > 1) return '#/retail';

}
function updateNavButtons(p){
  const back = document.getElementById('backBtn'), fwd = document.getElementById('fwdBtn'), up = document.getElementById('upBtn');
  const parent = parentOf(p);
  back.disabled = nav.pos <= 0 && !parent;
  fwd.disabled = nav.pos >= nav.stack.length - 1;
  if (parent) { up.href = parent; up.style.display = ''; } else { up.style.display = 'none'; }
}
function parse(){
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').filter(Boolean);

}

  track(location.hash && location.hash !== '#' ? location.hash : '#/');

  window.scrollTo(0,0);
}
function renderView(p){

  else if (p[0] === 'retail' && p[1] === 'walk-in') view.innerHTML = pageWalkIn(p[2] || 'overview');
  else if (p[0] === 'retail') { const v = VERTICALS.find(x => x.id === p[1]); view.innerHTML = v ? pageSoon(v.name, v.desc, [['Founders Office','#/'],['Retail Revenue','#/retail']], '#/retail', 'Back to Retail Revenue') : pageNotFound(); }
  else { const pr = PROJECTS.find(x => x.id === p[0]); view.innerHTML = pr ? pageSoon(pr.name, pr.desc, [['Founders Office','#/']], '#/', 'Back to all projects') : pageNotFound(); }
}

      }).join('') + `</div>`;

function crumbs(list){

/* ---------- Live data (Cloudflare Worker /api/metrics — aggregated, no customer data) ---------- */
let DATA = null, DATA_ERR = null, LOADING = false;
const F = { range: 'mtd', format: 'all', city: 'all', store: 'all', rev: 'net', cmp: 'prev', day: 'all', from: null, to: null };
const dayOk = (d) => F.day === 'all' || (F.day === 'weekend' ? ((new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7) >= 5 : ((new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7) < 5);
async function loadData(force){
  if (LOADING || (DATA && !force)) return;
  LOADING = true; DATA_ERR = null;
  try {
    const r = await fetch('/api/metrics', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    DATA = j;
  } catch (e) { DATA_ERR = String(e.message || e); }
  LOADING = false; rerender();
}
function rerender(){ const y = window.scrollY; const p = parse(); renderView(p); bind(); window.scrollTo(0, y); }

// ---------- formatting ----------
const nf = (n) => Math.round(n || 0).toLocaleString('en-IN');
const inr = (n) => { n = Math.round(n || 0); const a = Math.abs(n); if (a >= 1e7) return '₹' + (n / 1e7).toFixed(2) + ' Cr'; if (a >= 1e5) return '₹' + (n / 1e5).toFixed(1) + ' L'; return '₹' + n.toLocaleString('en-IN'); };
const pctv = (a, b) => (b > 0 ? (a / b) * 100 : null);
const pct = (a, b, dp = 1) => { const v = pctv(a, b); return v == null ? '—' : v.toFixed(dp) + '%'; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const deltaTxt = (cur, prev, kind) => {
  if (prev == null || cur == null) return '— no earlier period';
  if (kind === 'pts') { const d = cur - prev; return (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1) + ' pts vs previous period'; }
  if (!prev) return '— no earlier period';
  const d = ((cur - prev) / prev) * 100; return (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1) + '% vs previous period';
};
const SRC = { dsr: 'DSR sheet · live', sales: 'Sales sheet · live', bigin: 'Bigin · T-1', mix: 'Bigin × Sales × DSR', attr: 'Bigin × Sales' };

// ---------- date ranges ----------
const dAdd = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); };
const dDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
function rangeOf(key){
  const c = DATA.cutoff, s = DATA.startDate; let a, b = c;
  if (key === 'yesterday') a = c;
  else if (key === 'wtd') { const wd = (new Date(c + 'T00:00:00Z').getUTCDay() + 6) % 7; a = dAdd(c, -wd); }
  else if (key === 'mtd') a = c.slice(0, 8) + '01';
  else if (key === 'last') { const first = c.slice(0, 8) + '01'; b = dAdd(first, -1); a = b.slice(0, 8) + '01'; }
  else if (key === 'custom') { a = F.from || c.slice(0, 8) + '01'; b = F.to || c; if (b > c) b = c; }
  else a = s;
  if (a < s) a = s; if (b < a) b = a;
  return [a, b];
}
function prevOf([a, b]){
  if (F.cmp === 'lastmonth') { const back = (d) => { const [y, m, dd] = d.split('-').map(Number); const t = new Date(Date.UTC(y, m - 2, 1)); const last = new Date(Date.UTC(y, m - 1, 0)).getUTCDate(); return t.toISOString().slice(0, 8) + String(Math.min(dd, last)).padStart(2, '0'); }; const pa = back(a), pb = back(b); return pb < DATA.startDate ? null : [pa < DATA.startDate ? DATA.startDate : pa, pb]; }
  const len = dDiff(a, b) + 1; const pb = dAdd(a, -1), pa = dAdd(a, -len); return pb < DATA.startDate ? null : [pa < DATA.startDate ? DATA.startDate : pa, pb]; }
const RANGE_LABEL = { yesterday: 'Yesterday', wtd: 'Week to date (Mon–Sun)', mtd: 'Month to date', last: 'Last month', all: 'Since 1 Sep 2026' };

// ---------- filters ----------
const storeById = () => Object.fromEntries((DATA?.stores || []).map((s) => [s.id, s]));
const storeOk = (id) => { if (F.store !== 'all') return id === F.store; const s = storeById()[id] || {}; if (F.format !== 'all' && s.format !== F.format) return false; if (F.city !== 'all') return s.city === F.city; return true; };
const fmtOf = (id) => (storeById()[id] || {}).format || '';
const inR = (d, r) => d >= r[0] && d <= r[1];
const rows = (arr, r, key = 'd', sKey = 's') => (arr || []).filter((x) => inR(x[key], r) && dayOk(x[key]) && storeOk(x[sKey]));
const sName = (id) => (storeById()[id] || {}).name || id;

// ---------- core aggregation ----------
function agg(r){
  const d = rows(DATA.daily, r);
  const withDsr = d.filter((x) => x.walkins != null);
  const walk = withDsr.reduce((a, x) => a + x.walkins, 0);
  const capD = withDsr.reduce((a, x) => a + x.captured, 0), sameD = withDsr.reduce((a, x) => a + x.sameDay, 0), ordD = withDsr.reduce((a, x) => a + x.orders, 0);
  const at = rows(DATA.attributed, r);
  const storesActive = new Set(d.filter((x) => x.orders > 0 || x.walkins != null).map((x) => x.s));
  const days = dDiff(r[0], r[1]) + 1;
  return {
    walk, capD, sameD, ordD, conv: pctv(ordD, walk),
    captured: d.reduce((a, x) => a + x.captured, 0), sameDay: d.reduce((a, x) => a + x.sameDay, 0),
    orders: d.reduce((a, x) => a + x.orders, 0), retail: d.reduce((a, x) => a + x.retail, 0), online: d.reduce((a, x) => a + x.online, 0),
    cr: pctv(capD, walk - sameD), ccr: pctv(capD + sameD, walk),
    dsrIn: withDsr.length, dsrExp: storesActive.size * days,
    net: at.reduce((a, x) => a + x.net, 0), gross: at.reduce((a, x) => a + x.gross, 0),
    attOrders: at.length, converted: at.reduce((a, x) => a + x.first, 0),
    lag: at.filter((x) => x.first && x.lag != null).reduce((a, x, _, arr) => a + x.lag / arr.length, 0),
  };
}
function byStore(r){
  const m = {};
  const g = (s) => (m[s] = m[s] || { s, walk: 0, capD: 0, sameD: 0, ordD: 0, captured: 0, sameDay: 0, orders: 0, retail: 0, online: 0, dsrIn: 0, days: 0, net: 0, gross: 0, att: 0, conv: 0, elsewhereNet: 0, elsewhereN: 0, convN: 0 });
  for (const x of rows(DATA.daily, r)) { const o = g(x.s); o.days++; o.captured += x.captured; o.sameDay += x.sameDay; o.orders += x.orders; o.retail += x.retail; o.online += x.online; if (x.walkins != null) { o.dsrIn++; o.walk += x.walkins; o.capD += x.captured; o.sameD += x.sameDay; o.ordD += x.orders; } }
  for (const a of (DATA.attributed || []).filter((x) => inR(x.d, r) && dayOk(x.d))) {
    if (storeOk(a.s)) { const o = g(a.s); o.net += a.net; o.gross += a.gross; o.att++; o.convN += a.first; }
    if (a.cs !== a.s && storeOk(a.cs)) { const o = g(a.cs); o.elsewhereNet += a.net; o.elsewhereN++; }
  }
  return Object.values(m).map((o) => Object.assign(o, { cr: pctv(o.capD, o.walk - o.sameD), ccr: pctv(o.capD + o.sameD, o.walk), conv: pctv(o.ordD, o.walk) }));
}
const rev = (o) => (F.rev === 'gross' ? o.gross : o.net);
const src = (k) => `<span class="src">${SRC[k]}</span>`;
function kpiLive(items, cols){
  return `<div class="kpis" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">` + items.map((k) => `<div class="kpi"><span class="k-label">${k[0]}</span><span class="k-value num">${k[1]}</span><span class="k-delta ${toneOf(k[2])}">${k[2]}</span><span class="k-sub">${k[3]}</span>${src(k[4])}</div>`).join('') + `</div>`;
}
const loadingView = () => DATA_ERR
  ? `<section class="card"><h2>Live data could not be loaded</h2><p class="sub">${esc(DATA_ERR)}</p><button type="button" class="nbtn" id="retryBtn" style="margin-top:12px">Try again</button></section>`
  : `<section class="card"><h2>Loading live data…</h2><p class="sub">Reading Bigin (T-1), the Retail Sales sheet and the DSR sheet.</p></section>`;
function freshness(){
  const s = DATA.sources || {};
  const b = s.bigin || {};
  const bTxt = b.status === 'not_connected' ? 'Not connected yet' : (b.status === 'error' ? 'Last refresh failed — showing previous snapshot' : ('Refreshed ' + (b.refreshedAt ? new Date(b.refreshedAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Kolkata' }) + ' IST' : '—')));

}

// ---------- Pages: landing ----------
function attentionItems(){
  const r = rangeOf('mtd'); const st = byStore(r).filter((o) => o.walk >= 20 && o.cr != null && o.s !== 'UNMAPPED').sort((a, b) => a.cr - b.cr);
  const out = [];
  ['Mall', 'High street'].forEach((f) => { const o = st.find((x) => fmtOf(x.s) === f); if (o) out.push([`${esc(sName(o.s))}: lowest ${f.toLowerCase()} capture rate, ${o.cr.toFixed(1)}%`, `${nf(o.capD)} captured of ${nf(o.walk - o.sameD)} drop-offs this month`, '#/retail/walk-in/capture']); });
  const y = DATA.cutoff; const missing = (DATA.daily || []).filter((x) => x.d === y && x.walkins == null && x.orders > 0).length;
  if (missing) out.push([`${missing} store${missing > 1 ? 's' : ''} missed yesterday's DSR`, 'Their capture rate for the day can\'t be calculated', '#/retail/walk-in/capture']);
  const nc = (DATA.hygiene || []).filter((h) => h.k === 'notCalled7').reduce((a, h) => a + h.n, 0);

  const cw = (DATA.hygiene || []).filter((h) => h.k === 'crmWonNoOrder').reduce((a, h) => a + h.n, 0);

function wellItems(){
  const r = rangeOf('mtd'); const p = prevOf(r); const a = agg(r); const b = p ? agg(p) : null;

  const out = [];

  const top = byStore(r).filter((o) => o.net > 0).sort((x, y) => y.net - x.net)[0];

}
function pageHome(){

    return `<div class="vert"><a class="vert-head" href="#/${pr.id}"><span><b>${pr.name}</b><br><span class="p-meta">${pr.desc}</span></span>${pr.live ? `<span class="badge b-good">${VERTICALS.filter((v) => v.live).length} of ${VERTICALS.length} projects live</span>` : '<span class="badge b-grey">Coming soon</span>'}</a>${projects}</div>`;
  }).join('');
  return hero + freshness() + `<div class="hl-grid">` + HL.map((h) => `<a class="hl" href="${h[5]}"><span class="h-label">${h[0]}</span><span class="h-value num">${h[1]}</span><span class="k-delta ${toneOf(h[2])}">${h[2]}</span><span class="h-src">${h[3]}</span>${src(h[4])}</a>`).join('') + `</div>

function pageRetail(){

  const tot = (arr) => (arr || []).reduce((s, x) => s + x.n, 0);
  const lost = tot(loss), lostP = lossP ? tot(lossP) : null;
  const noR = tot(loss.filter((x) => x.r === 'No reason recorded')), noRP = lossP ? tot(lossP.filter((x) => x.r === 'No reason recorded')) : null;
  const d1 = wdelta(lost, lostP, { short: true, invert: true }), d4 = wdelta(noR, noRP, { short: true, invert: true });
  const kp = wkpis([
    { l: 'Closed-lost leads', v: nf(lost), d: d1.d, tone: d1.tone, s: 'Lost stage, no later order' },
    { await: true, l: 'Unreachable', need: 'Needs auto-close as "Unreachable" after RNR 3' },
    { l: 'Reached, then lost', v: nf(lost), d: '— all recorded losses today', tone: 'flat', s: 'Share awaits the Unreachable stage' },
    { l: 'Lost with no reason', v: nf(noR), d: d4.d, tone: d4.tone, s: 'Counts against CRM hygiene' },
  ]);
  const stores = {}; for (const x of loss) if (x.s !== 'UNMAPPED') stores[x.s] = (stores[x.s] || 0) + x.n;
  const sl = Object.entries(stores).sort((x, y) => x[1] - y[1]); const maxS = Math.max(1, ...sl.map((x) => x[1]));
  const ur = wcard('Unreachable vs reached-but-lost', 'Unreachable = calling discipline and timing · reached-but-lost = pitch, price or product', `<div class="wl-legend"><span><i class="wl-sw" style="background:${C.rust}"></i>Unreachable (RNR 3) · ${AWAIT.toLowerCase()}</span><span><i class="wl-sw" style="background:${C.teal}"></i>Reached, then lost</span></div>` +
    (sl.length ? `<div class="wl-rank" style="grid-template-columns:minmax(100px,150px) minmax(0,1fr) 60px">` + sl.map(([s, n]) => `<span class="wl-sn">${esc(sName(s))}</span><div class="wl-track"><div style="width:${n / maxS * 100}%;background:${C.teal}"></div></div><span style="text-align:right;font-size:13px;font-variant-numeric:tabular-nums">${nf(n)}</span>`).join('') + `</div>` : '<p class="sub" style="margin-top:14px">No lost leads in this range.</p>'));
  const reasons = {}; for (const x of loss) reasons[x.r] = (reasons[x.r] || 0) + x.n;
  const rs = Object.entries(reasons).sort((x, y) => y[1] - x[1]); let cum = 0;
  const par = wcard('Loss reasons', 'Reached-but-lost leads · reason labels come from the Bigin dropdown', rs.length ? `<div class="wl-rank" style="grid-template-columns:minmax(140px,200px) minmax(0,1fr) 50px 80px">` + rs.map(([rr, n]) => { cum += n; return `<span class="wl-sn">${esc(rr)}</span><div class="wl-track"><div class="wl-fill" style="width:${n / rs[0][1] * 100}%;background:${C.teal}"></div></div><span style="text-align:right;font-size:13px;font-weight:600">${pct(n, lost, 0)}</span><span style="text-align:right;font-size:12px;color:#5B6068">${pct(cum, lost, 0)} cum.</span>`; }).join('') + `</div>` : '<p class="sub" style="margin-top:14px">No lost leads in this range.</p>');
  const top = rs.slice(0, 6).map(([rr]) => rr); const L = 'ABCDEF';
  const key = top.length ? `<p class="wl-note" style="margin-top:8px">${top.map((rr, i) => `<b>${L[i]}</b> ${esc(rr)}`).join(' · ')}</p>` : '';
  const matrix = (groups) => { const g = groups.map(([name, arr]) => { const t = tot(arr); return [name, top.map((rr) => pctv(tot(arr.filter((x) => x.r === rr)), t))]; }); const mx = Math.max(1, ...g.flatMap(([, v]) => v.map((x) => x || 0)));
    return `<div class="wl-heat" style="grid-template-columns:minmax(100px,150px) repeat(${top.length},minmax(0,1fr))"><span></span>${top.map((_, i) => `<span class="wl-hh">${L[i]}</span>`).join('')}` + g.map(([name, vals]) => `<span class="wl-hn" title="${esc(name)}">${esc(name)}</span>` + vals.map((v) => `<div class="wl-cell" style="${heatBg(v || 0, mx)}">${pctTxt(v, 0)}</div>`).join('')).join('') + `</div>`; };
  const sg = Object.keys(stores).sort((x, y) => stores[y] - stores[x]).slice(0, 10).map((s) => [sName(s), loss.filter((x) => x.s === s)]);
  const byStoreC = wcard('Loss reason by store', 'Share of each store\'s reached-but-lost leads · a store-only spike is a local problem, a column-wide one is network-wide', sg.length ? key + matrix(sg) : '<p class="sub" style="margin-top:14px">No lost leads in this range.</p>');
  const cats = {}; for (const x of loss) if (x.c) cats[x.c] = (cats[x.c] || 0) + x.n;
  const cg = Object.keys(cats).sort((x, y) => cats[y] - cats[x]).slice(0, 10).map((c) => [c, loss.filter((x) => x.c === c)]);
  const byCat = wcard('Loss reason by product category', 'Share of each category\'s reached-but-lost leads · points to price, stock or product-fit issues', cg.length ? key + matrix(cg) : wawait('Needs Product Category filled on lost leads in Bigin'));
  return kp + `<div class="wl-g2">${ur}${par}</div><div class="wl-g2">${byStoreC}${byCat}</div>`;
}
function activeStores(r){ return [...new Set((DATA.daily || []).filter((x) => inR(x.d, r) && storeOk(x.s) && x.s !== 'UNMAPPED' && (x.orders > 0 || x.walkins != null)).map((x) => x.s))]; }

const noStoreNote = (r) => { if (F.store !== 'all' || F.city !== 'all' || F.format !== 'all') return ''; const n = (DATA.daily || []).filter((x) => x.s === 'UNMAPPED' && inR(x.d, r)).reduce((a, x) => a + x.captured, 0); return n ? `Includes ${nf(n)} with no store (kept in totals, not in store views)` : ''; };
function wDefs(){
  const box = (t, s, c = '') => `<div class="fbox ${c}"><b>${t}</b><span>${s}</span></div>`;
  const ar = '<span class="arrow" aria-hidden="true">→</span>';
  const flow = card('Funnel flow', 'How a walk-in becomes attributed revenue, and where each number comes from.', `<div class="flow">
    <div class="flow-row"><span class="flow-tag">1. Store visit</span>${box('Walk-ins', 'DSR: New + Other Walk-ins, latest submission per store per day')}${ar}${box('Same-day order', 'Captured phone that bought the same day', 'rev')}<span style="color:var(--muted);font-size:13px">or</span>${box('Drop-off', 'Walk-ins − same-day orders')}</div>
    <div class="flow-row"><span class="flow-tag">2. Capture</span>${box('Captured lead', 'Bigin walk-in pipeline, unique phone per store per day', 'lead')}<span style="color:var(--muted);font-size:13px">or</span>${box('Uncaptured', 'No record', 'leak')}</div>
    <div class="flow-row"><span class="flow-tag">3. Follow-up</span>${box('Bigin stage', 'Shown as recorded, marked unverified', 'lead')}${ar}${box('Hygiene checks', 'Stage vs real orders', 'leak')}</div>
    <div class="flow-row"><span class="flow-tag">4. Conversion</span>${box('Attributed order', 'Sales sheet order dated after a lead date for the same phone', 'rev')}${ar}${box('Revenue', 'Net headline, gross alongside; credited to the billing store', 'rev')}</div>
  </div>`);
  const F2 = [
    ['Capture rate', 'Captured leads ÷ (Walk-ins − Same-day orders) × 100', 'Only store-days with a DSR are used.'],
    ['Capture + conversion rate', '(Captured leads + Same-day orders) ÷ Walk-ins × 100', 'Only store-days with a DSR are used.'],
    ['Captured leads', 'Unique phone per store per lead date in Bigin', 'A lead is excluded if that phone has an order on the same date (any store).'],
    ['Same-day orders', 'Orders at the store on a date whose phone also has a Bigin lead that date', 'Counted per unique POS Order ID.'],
    ['Attributed (walk-in) order', 'Order date strictly after a Bigin lead date for the same phone (last 10 digits)', 'Same as the OLM reference sheet: lead date < order date. No time limit.'],
    ['Revenue', 'Net = Amount Paid − Return Amount; Gross = Amount Paid', 'Rows marked CANCELLED in Ret/Exc are dropped. TESTSTORE (FRIDO_0000) excluded.'],
  ];
  const formulas = card('Formulas', '', F2.map((f) => `<div style="padding:12px 0;border-bottom:1px solid var(--line-soft)"><strong>${f[0]}</strong><div class="formula">${f[1]}</div><div class="sub" style="margin-top:6px">${f[2]}</div></div>`).join(''));
  const q = DATA?.quality || {};
  const srcRows = [
    ['Walk-ins', 'DSR Google Sheet (published CSV)', 'Live, cached 5 min', 'New Walk-ins + Other Walk-ins'],
    ['Orders & revenue', 'Retail Sales Google Sheet (published CSV)', 'Live, cached 5 min', 'One order per POS Order ID'],
    ['Walk-in leads', 'Bigin via MCP (walk-in pipeline)', 'Daily 6:00 AM IST (T-1)', 'Store from Store Location, else owner'],
  ];
  const sources = card('Data sources', 'All metrics are cut at yesterday (T-1) so the three sources line up.', table(['Data', 'Source', 'Refresh', 'Notes'], srcRows.map((r) => `<tr><td class="strong">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td style="white-space:normal">${r[3]}</td></tr>`)));
  const um = Object.entries(q.biginUnmapped || {}); const ud = Object.entries(q.dsrUnmapped || {});
  const quality = card('Data quality', 'What the dashboard had to leave out, from the latest load.', DATA ? table(['Check', 'Count', 'Detail'], [
    `<tr><td class="strong">Manual walk-in overrides</td><td>${nf((q.manualOverrides || []).length)}</td><td style="white-space:normal">${(q.manualOverrides || []).map((o) => esc(o.id) + ' · ' + esc(o.d) + ' · ' + inr(o.gross) + ' — ' + esc(o.note)).join('<br>') || '—'}</td></tr>`,
    `<tr><td class="strong">Cancelled sales lines dropped</td><td>${nf(q.salesCancelledLines)}</td><td>Ret/Exc = CANCELLED</td></tr>`,
    `<tr><td class="strong">Bigin leads without a walk-in date</td><td>${nf(q.biginNoDate)}</td><td>Can't be placed on a day</td></tr>`,
    `<tr><td class="strong">Bigin leads without a valid phone</td><td>${nf(q.biginNoPhone)}</td><td>Can't be matched to orders</td></tr>`,
    `<tr><td class="strong">Bigin leads without a store</td><td>${nf(um.reduce((s, x) => s + x[1], 0))}</td><td style="white-space:normal">${um.map(([n, c]) => esc(n) + ' (' + c + ')').join(', ') || '—'}</td></tr>`,
    `<tr><td class="strong">DSR rows with an unknown store</td><td>${nf(ud.reduce((s, x) => s + x[1], 0))}</td><td style="white-space:normal">${ud.map(([n, c]) => esc(n) + ' (' + c + ')').join(', ') || '—'}</td></tr>`,
  ]) : '<p class="sub">Loads with live data.</p>');
  const D = [
    ['Start date', 'Counting starts 1 Sep 2026; attribution still looks back at all Bigin history.'],
    ['DSR duplicates', 'Latest submission per store per date is final, even if zero; never summed.'],
    ['Duplicate leads', 'Unique phone per store per day for capture metrics.'],
    ['Sales credit', 'The store that billed the order. The capturing store keeps capture credit.'],
    ['Pipeline', 'Order match overrides stage (Won); other stages shown as recorded, marked unverified.'],
    ['Store format', '16 Mall, 7 High street; leaderboards and highlights rank each format separately.'],
    ['Leads without a store', 'Owner is a person and Store Location is empty: kept in totals, left out of store-level views.'],
    ['Hidden KPIs', 'SLA trend, call attempts, escalations and capture point stay hidden until a source exists.'],
  ];
  const decisions = card('Key decisions', 'Rules agreed with the Founders Office.', table(['Topic', 'Decision'], D.map((r) => `<tr><td class="strong">${r[0]}</td><td style="white-space:normal">${r[1]}</td></tr>`)));
  return `<div class="grid">${flow}</div><div class="grid g2">${formulas}${sources}</div><div class="grid g2">${quality}${decisions}</div>`;
}

const DESIGN_BOARDS = [
  { id:'overview', name:'Overview', h:2020 },{ id:'capture', name:'Capture', h:1560 },{ id:'follow-up', name:'Follow-up', h:1640 },
  { id:'revenue', name:'Revenue', h:1600 },{ id:'loss', name:'Loss analysis', h:1220 }
];

const BOARD_DATA = JSON.parse(document.getElementById('boards-data').textContent);
const BOARD_LINKS = { Main:'overview', Capture:'capture', FollowUp:'follow-up', Revenue:'revenue', Loss:'loss' };
function renderBoard(host, id, h, fit, onNav){
  host.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:1440px;height:' + h + 'px;transform-origin:0 0';
  host.appendChild(wrap);
  const root = wrap.attachShadow({ mode: 'open' });
  root.innerHTML = '<style>' + BOARD_DATA.css + '</style>' + BOARD_DATA.boards[id];
  root.addEventListener('click', (e) => {
    const a = e.composedPath().find(n => n && n.tagName === 'A');
    if (!a) return;
    const m = (a.getAttribute('href') || '').match(/(Main|Capture|FollowUp|Revenue|Loss)\.dc\.html/);
    if (m) { e.preventDefault(); onNav(BOARD_LINKS[m[1]]); }
  });
  scaleBoard(host, h, fit);
}
function scaleBoard(host, h, fit){
  const wrap = host.firstElementChild; if (!wrap) return;
  const s = fit ? Math.min(1.5, host.clientWidth / 1440) : 1;
  wrap.style.transform = 'scale(' + s + ')';
  host.style.height = Math.ceil(h * s) + 'px';
  host.style.overflowX = fit ? 'hidden' : 'auto';
}
const designView = { fit: true };
function wDesign(){
  const cur = DESIGN_BOARDS.find(b => b.id === parse()[3]) || DESIGN_BOARDS[0];
  return `<section class="card">
    <div class="card-head"><div><h2>Design flow</h2><p class="sub">Original design reference with illustrative values — not live data. Links inside a board switch boards here.</p></div>
      <button type="button" class="nbtn" id="fitBtn">${designView.fit ? 'Show actual size' : 'Fit to width'}</button></div>
    <nav class="dz-tabs" aria-label="Design boards">${DESIGN_BOARDS.map(b => `<a class="dz-tab ${b.id===cur.id?'active':''}" href="#/retail/walk-in/design/${b.id}" ${b.id===cur.id?'aria-current="page"':''}>${b.name}</a>`).join('')}</nav>
    <div class="dz-host" id="dzHost" data-board="${cur.id}" data-h="${cur.h}"><p class="sub" id="dzMsg">Loading the ${cur.name} board…</p></div>
  </section>`;
}
function sizeDesign(){
  const host = document.getElementById('dzHost'); if (!host) return;
  scaleBoard(host, +host.dataset.h, designView.fit);
}
function mountDesign(){
  const host = document.getElementById('dzHost'); if (!host) return;
  renderBoard(host, host.dataset.board, +host.dataset.h, designView.fit, (id) => { location.hash = '#/retail/walk-in/design/' + id; });
}
window.addEventListener('resize', sizeDesign);
window.addEventListener('message', (e) => {
  const d = e.data;
  if (d && typeof d === 'object' && typeof d.fridoDesignNav === 'string' && DESIGN_BOARDS.some(b => b.id === d.fridoDesignNav)) {
    location.hash = '#/retail/walk-in/design/' + d.fridoDesignNav;
  }
});

/* ---------- Events ---------- */
function bind(){
  const fit = document.getElementById('fitBtn');
  if (fit) fit.addEventListener('click', () => { designView.fit = !designView.fit; fit.textContent = designView.fit ? 'Show actual size' : 'Fit to width'; sizeDesign(); });
  mountDesign();
  document.querySelectorAll('select[data-f]').forEach((el) => el.addEventListener('change', () => { F[el.dataset.f] = el.value; if (el.dataset.f === 'city' || el.dataset.f === 'format') F.store = 'all'; rerender(); }));
  document.querySelectorAll('[data-seg]').forEach((el) => el.addEventListener('click', () => { F.format = el.dataset.seg; F.store = 'all'; rerender(); }));
  document.querySelectorAll('input[data-d]').forEach((el) => el.addEventListener('change', () => { F[el.dataset.d] = el.value; rerender(); }));
  document.querySelectorAll('[data-city]').forEach((el) => el.addEventListener('click', (e) => { e.preventDefault(); F.city = el.dataset.city; F.store = 'all'; rerender(); }));
  const rl = document.getElementById('reloadBtn'); if (rl) rl.addEventListener('click', () => { DATA = null; loadData(true); rerender(); });
  const rt = document.getElementById('retryBtn'); if (rt) rt.addEventListener('click', () => { DATA_ERR = null; loadData(true); rerender(); });
}
document.getElementById('backBtn').addEventListener('click', () => {
  if (nav.pos > 0) history.back();
  else { const parent = parentOf(parse()); if (parent) location.hash = parent; }
});
document.getElementById('fwdBtn').addEventListener('click', () => { if (nav.pos < nav.stack.length - 1) history.forward(); });
document.getElementById('menuBtn').addEventListener('click', (e) => {
  const side = document.getElementById('side');
  const open = side.classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
go();
</script>
