name = "walkin-dashboard"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "64cd065d47d134cf62ccfb35bd874af9"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DASH_KV"
id = "557386ba9dee45b3ae9f99d967109a42"

[triggers]
crons = ["30 0 * * *"]

[vars]
# Sign-in & roles (Cloudflare Access, one-time PIN). Until BOTH Access values are filled in, the dashboard stays open as today.
ACCESS_TEAM_DOMAIN = "dark-art-9d99.cloudflareaccess.com"     # Zero Trust → Settings → Team domain
ACCESS_AUD = "532cf9ceab9f7e45e287c6fbae366d441e2c760f4212b6836108887e214c96bf"   # Zero Trust → Access → Applications → walkin-dashboard → Overview
ADMIN_EMAILS = "juned.m@myfrido.com"                          # permanent admins (comma-separated); can never be locked out
START_DATE = "2026-09-01"
WALKIN_PIPELINE_ID = "1371203000000480122"
BIGIN_MCP_URL = "https://bigin.zohomcp.in/mcp/message"
# Sales come from BigQuery: apps-script/SalesToDashboard.gs syncs them daily at 08:00 IST (POST /admin/ingest-sales).
DSR_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBggrBOrbDGyU-5TQucn82YnpR6KcKUUgp6JRJW9FP_SRbK4jDSIDQcFdvSIUu5KPkbNfG6oPXQZCu/pub?gid=194259253&single=true&output=csv"

# Chat-with-Data bot · Workers AI (free 10,000 Neurons/day)
[ai]
binding = "AI"

# Chat-with-Data bot · D1 database (free: 5 GB, 5M rows read / 100k rows written per day).
# Create it once: Cloudflare → Storage & databases → D1 → Create → name "walkin-bot", copy its ID,
# then remove the # from the 4 lines below and paste the ID.
[[d1_databases]]
binding = "DB"
database_name = "walkin-bot"
database_id = "a7ae2478-7a94-42c4-be85-480ec0aceb68"

[observability]
enabled = true
