# Frido Founders Office — Walk-in dashboard (Cloudflare Worker + static assets)
name = "walkin-dashboard"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "64cd065d47d134cf62ccfb35bd874af9"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

# Stores the Bigin T-1 snapshot and the Bigin MCP login.
# No id on purpose: on the first deploy Wrangler creates this KV namespace automatically and keeps it linked.
# If a later deploy ever fails with a KV error, copy the namespace ID from
# Storage & databases → Workers KV and add:  id = "<that id>"
[[kv_namespaces]]
binding = "DASH_KV"

# Daily Bigin refresh at 06:00 IST (= 00:30 UTC).
[triggers]
crons = ["30 0 * * *"]

[vars]
START_DATE = "2026-09-01"
WALKIN_PIPELINE_ID = "1371203000000480122"
BIGIN_MCP_URL = "https://bigin.zohomcp.in/mcp/message"
SALES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTzF8v-e2kDnhFPXs9u0LT3A3EAd2exjyj_Uq4w27HJkAPOXKCOXzYVQ99gIxBhVCP0qp18xb1RzzQA/pub?output=csv"
DSR_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBggrBOrbDGyU-5TQucn82YnpR6KcKUUgp6JRJW9FP_SRbK4jDSIDQcFdvSIUu5KPkbNfG6oPXQZCu/pub?gid=194259253&single=true&output=csv"
# Secret (never in this file): ADMIN_KEY → npx wrangler secret put ADMIN_KEY

[observability]
enabled = true
