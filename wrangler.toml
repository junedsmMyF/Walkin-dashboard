name = "walkin-dashboard"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "64cd065d47d134cf62ccfb35bd874af9"
workers_dev = true
# Keep variables set in the Cloudflare dashboard on deploy (a deploy wiped LIMECHAT_CSV_URL / ROUTING_CSV_URL on 22 Oct 2026).
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DASH_KV"
id = "557386ba9dee45b3ae9f99d967109a42"

[triggers]
crons = ["30 0 * * *", "10 * * * *"]  # daily full Bigin refresh · hourly PDP Inventories stages (read-only)

[vars]
# Sign-in & roles — a one-time code is emailed to each approved person when they sign in (no Cloudflare setup).
# 1) Set up apps-script/Mailer.gs as a web app and paste its URL below; add the Cloudflare secret MAILER_SECRET.
# 2) Approve people at /admin/users?key=…   3) remove the # from LOGIN and MAILER_URL below, and commit.
MAILER_URL = "https://script.google.com/macros/s/AKfycbyMVbbPN58nb2WJ4wwyNKS6vfSCW34dag9Jnnkwpt3ssH7Oz1HMXK0VBKxBAxjqLU31Fg/exec"
LOGIN = "on"
# (Optional alternative: Cloudflare Access — only if it is switched on for this address. Leave these two commented out.)
# ACCESS_TEAM_DOMAIN = "dark-art-9d99.cloudflareaccess.com"     # Zero Trust → Settings → Team domain
# ACCESS_AUD = "532cf9ceab9f7e45e287c6fbae366d441e2c760f4212b6836108887e214c96bf"   # Zero Trust → Access → Applications → walkin-dashboard → Overview
ADMIN_EMAILS = "juned.m@myfrido.com"                          # permanent admins (comma-separated); can never be locked out
START_DATE = "2026-09-01"
WALKIN_PIPELINE_ID = "1371203000000480122"
CALLBACK_PIPELINE_ID = "1371203000000629516"   # Bigin "Callback Requests" — website Call Store pop-up (PDP inventories)
PDP_INV_PIPELINE_ID = "1371203000000675914"    # Bigin "PDP Inventories" — LimeChat → Bigin (live 21 Oct 2026), read-only
PDP_INV_FROM = "2026-10-22"                    # WhatsApp leads: LimeChat export until 21 Oct, Bigin PDP Inventories from this date (owner, 22 Oct 2026)
PDP_START_DATE = "2026-10-08"                   # Callback Requests pipeline went live
META_PIPELINE_ID = "1371203000000558349"       # Bigin "Meta Ergo Workspace Assessment" — Meta Lead Gen leads (Meta ads)
META_START_DATE = "2026-09-09"                  # Meta Lead Gen ads went live
# LIMECHAT_CSV_URL is a SECRET (Worker → Settings → Variables and secrets): the LimeChat export holds customer phones and names, and this repo is public.
# ROUTING_CSV_URL is a SECRET too: the published "Lead routing backend" sheet (WhatsApp DSR groups → Sheet) holds customer names and phones.
# RETENTION_CSV_URL is a SECRET: the published LimeChat broadcast report for retention offers (phones). Until it is set, Retail retention shows sample data.
BACKEND_AGENTS = ""                             # optional extra backend-agent names (comma-separated) as they appear on DevX orders; Bigin lead owners are included automatically
BIGIN_MCP_URL = "https://bigin.zohomcp.in/mcp/message"
# Sales come from BigQuery: apps-script/SalesToDashboard.gs syncs them daily at 08:00 IST (POST /admin/ingest-sales).
DSR_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBggrBOrbDGyU-5TQucn82YnpR6KcKUUgp6JRJW9FP_SRbK4jDSIDQcFdvSIUu5KPkbNfG6oPXQZCu/pub?gid=194259253&single=true&output=csv"

# Chat-with-Data bot · Workers AI (free 10,000 Neurons/day)
[ai]
binding = "AI"

# Chat-with-Data bot · D1 database (free: 5 GB, 5M rows read / 100k rows written per day).
# Create it once: Cloudflare → Storage & databases → D1 → Create → name "walkin-bot", copy its ID,
# then remove the # from the 4 lines below and paste the ID.
[[d1_databases]]
binding = "DB"
database_name = "walkin-bot"
database_id = "a7ae2478-7a94-42c4-be85-480ec0aceb68"

[observability]
enabled = true
